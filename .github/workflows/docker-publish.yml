name: Build & Push ComfyUI Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'fetch-model.sh'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: 'ComfyUI git ref (tag/branch/sha)'
        default: 'master'
      manager_ref:
        description: 'ComfyUI-Manager git ref'
        default: 'main'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/comfyui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            COMFYUI_REF=${{ github.event.inputs.comfyui_ref || 'master' }}
            MANAGER_REF=${{ github.event.inputs.manager_ref || 'main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          no-cache: true
