# ComfyUI on the Rancher cluster (namespace c30636-default, PodSecurity=restricted).
# Modeled on ffformer/deploy/k8s-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: c30636-default
  labels:
    app: comfyui
    workload.user.cattle.io/workloadselector: apps.deployment-c30636-default-comfyui
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate          # single GPU + RWO PVC: never run two pods at once
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
        workload.user.cattle.io/workloadselector: apps.deployment-c30636-default-comfyui
      namespace: c30636-default
    spec:
      runtimeClassName: nvidia
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # imagePullSecrets:          # only if the image is private on Docker Hub
      #   - name: dockerhub-secret
      containers:
        - name: comfyui
          # Pinned by digest so restarts never pull; bump deliberately after a new build (README §更新).
          # = commit b69a7fb (latest nodes, whisper baked in). Pre-pull with k8s/90-prepull-job.yaml before applying.
          image: ghcr.io/zhangenzhi/comfyui@sha256:513dc48e30c01db956e73b26c76bece5b196fab37caa2e59d18ff121d9acd9c8
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          # Debug: replace with sleep to poke around
          #   command: ["sleep"]
          #   args: ["infinity"]
          # Kill the vLLM sidecar before SIGTERM: a sidecar mid-load (uninterruptible I/O on the
          # PVC) can keep the old container alive and block the Recreate rollout.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "pkill -9 -f 'bin/vllm serve' || true"]
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          env:
            - name: COMFYUI_BASE_DIR
              value: /workspace/data
            - name: COMFYUI_PORT
              value: "8188"
            # Extra ComfyUI CLI flags, e.g. "--preview-method auto --highvram"
            # --reserve-vram 70: the vLLM sidecar (Qwen2.5-72B-AWQ, 0.85 of 80 GB = 68 GB) shares this GPU; ComfyUI only concatenates/subtitles
            - name: COMFYUI_ARGS
              value: "--preview-method auto --reserve-vram 70"
            # 1 = git pull ComfyUI at every start (like ffformer entrypoint). 0 = pinned image code.
            - name: COMFYUI_AUTO_UPDATE
              value: "0"
            # ---- MiniMax-H3 on the HPC (custom_nodes/comfyui-minimax-h3) ----
            # SGLang server started by /lustre1/work/c30636/test/minimax-h3/scripts/serve_h3.pbs;
            # the pod reaches the compute node directly. Update when the PBS job moves.
            - name: H3_ENDPOINT
              value: "172.31.17.244:30010"
            - name: H3_ROOT
              value: /lustre1/work/c30636/test/minimax-h3
            # Optional SSH access to the HPC login node (endpoint discovery / qsub).
            - name: HPC_HOST
              value: 172.31.20.1
            - name: HPC_USER
              value: c30746
            - name: HPC_KEY_PATH
              value: /secrets/hpc/key
            - name: OLLAMA_URL
              value: http://ollama:11434
            # Screenplay LLM: vLLM sidecar on this pod's H100 (started by the entrypoint), OpenAI-compatible
            - name: H3_LLM_SIDECAR
              value: "1"
            - name: H3_LLM_BACKEND
              value: openai
            - name: H3_LLM_URL
              value: http://127.0.0.1:8001/v1
            - name: H3_LLM_MODEL
              value: Qwen2.5-72B-Instruct-AWQ
            - name: H3_LLM_GPU_FRAC
              value: "0.85"
            - name: H3_LOCAL_LLM
              value: Qwen2.5-14B-Instruct
            - name: HF_TOKEN            # for fetch-model on gated HF repos (optional)
              valueFrom:
                secretKeyRef:
                  name: comfyui-hf-token
                  key: token
                  optional: true
          volumeMounts:
            - name: data-vol
              mountPath: /workspace/data
            - name: shm
              mountPath: /dev/shm
            - name: hpc-ssh
              mountPath: /secrets/hpc
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          # Startup can be slow (custom nodes import, first-run pip). Give it up to 15 min.
          startupProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: data-vol
          persistentVolumeClaim:
            claimName: comfyui-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: hpc-ssh
          secret:
            secretName: comfyui-hpc-ssh
            defaultMode: 0400
            optional: true          # create it to enable SSH features (see README)
---
# In-cluster entry (ClusterIP) - used by the TLS proxy and by port-forward.
apiVersion: v1
kind: Service
metadata:
  name: comfyui-svc
  namespace: c30636-default
  labels:
    app: comfyui
spec:
  type: ClusterIP
  selector:
    app: comfyui
  ports:
    - name: http
      port: 8188
      targetPort: http
      protocol: TCP
---
# NodePort for quick LAN access (same as ffformer-infer-svc). Delete if not wanted.
apiVersion: v1
kind: Service
metadata:
  name: comfyui-nodeport
  namespace: c30636-default
  labels:
    app: comfyui
spec:
  type: NodePort
  selector:
    app: comfyui
  ports:
    - name: http
      port: 8188
      targetPort: http
      protocol: TCP
