# Public HTTPS entry for ComfyUI: MetalLB LoadBalancer -> nginx (TLS + Basic Auth)
# -> comfyui-svc:8188. Same pattern as ffformer/deploy/k8s-https.yaml, plus
# Basic Auth because ComfyUI itself has NO authentication.
#
# Prerequisites (created out-of-band, NOT committed):
#   1) TLS cert (self-signed for now, official later):
#        openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#          -keyout tls.key -out tls.crt -subj "/CN=<comfyui-hostname>"
#        kubectl -n c30636-default create secret tls comfyui-tls --cert=tls.crt --key=tls.key
#   2) Basic auth users:
#        htpasswd -Bc htpasswd <user>          # (apache2-utils) or: python -c 'import bcrypt...'
#        kubectl -n c30636-default create secret generic comfyui-htpasswd --from-file=htpasswd
#   3) A MetalLB intermediate IP from the centre (サービス公開申請). Put it in
#      the loadBalancerIPs annotation below. Until then the Service stays <pending>.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-nginx-tls
  namespace: c30636-default
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name <comfyui-hostname>;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        auth_basic           "ComfyUI";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        # image/video uploads and model uploads can be large
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://comfyui-svc:8188;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # ComfyUI progress/preview uses a WebSocket on /ws
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-tls
  namespace: c30636-default
  labels:
    app: comfyui-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui-tls
  template:
    metadata:
      labels:
        app: comfyui-tls
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
      volumes:
        - name: conf
          configMap:
            name: comfyui-nginx-tls
        - name: tls
          secret:
            secretName: comfyui-tls
        - name: auth
          secret:
            secretName: comfyui-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-public
  namespace: c30636-default
  labels:
    app: comfyui
  annotations:
    # Intermediate IP assigned by the centre for THIS service (ffformer uses 172.31.229.16 - do not reuse)
    metallb.universe.tf/loadBalancerIPs: "<intermediate-ip>"
spec:
  type: LoadBalancer
  selector:
    app: comfyui-tls
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
