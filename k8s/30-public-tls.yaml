# Public HTTPS entry for ComfyUI — PATH-BASED, sharing ffformer's IP/port.
#
#   https://j-peaks-forestformer3d.hucc.hokudai.ac.jp/test/comfyui/
#
# No new IP, port, DNS name or LoadBalancer is needed: the existing
# ffformer-tls nginx (172.31.229.16:443) has a `location /test/comfyui/`
# that strips the prefix and proxies to comfyui-svc:8188 with Basic Auth.
#
# The nginx config and the ffformer-tls Deployment live in the ffformer repo
# and that file is the single source of truth — edit it there, then:
#
#   kubectl apply -f /lustre1/work/c30636/ffformer/deploy/k8s-https.yaml
#   kubectl -n c30636-default rollout restart deploy/ffformer-tls   # nginx does not reload ConfigMaps by itself
#
# What was added there (2026-09-09):
#   - ConfigMap ffformer-nginx-tls:  location = /test/comfyui  (301 -> trailing slash, absolute_redirect off)
#                                     location /test/comfyui/  (auth_basic + WebSocket headers +
#                                       proxy_pass http://comfyui_backend$comfyui_uri  where $comfyui_uri is a map of
#                                       $request_uri with the prefix stripped: keeps %2F-encoded userdata paths and
#                                       query strings intact; an `upstream comfyui_backend` block avoids needing a resolver)
#   - Deployment ffformer-tls:       volume `auth` from Secret comfyui-htpasswd mounted at /etc/nginx/auth
#
# Basic Auth users (Secret comfyui-htpasswd, created out-of-band, NOT committed):
#   htpasswd -Bc htpasswd <user>                # add more users: htpasswd -B htpasswd <user2>
#   kubectl -n c30636-default create secret generic comfyui-htpasswd \
#     --from-file=htpasswd --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n c30636-default rollout restart deploy/ffformer-tls
#
# The only ComfyUI-side requirement is that the frontend is opened at the
# sub-path WITH a trailing slash; its API base is derived from the page path.
#
# If you ever get a dedicated hostname instead, the host-based variant is a
# second `server { server_name ...; }` block in the same ConfigMap.
---
# Nothing to apply from this file. Kept so the k8s/ directory documents the
# complete public path. The in-cluster Service it targets is comfyui-svc
# (see 10-deployment.yaml).
