# nginx snippet for serving ComfyUI under a sub-path (/test/comfyui/) of an existing TLS nginx.
# In our cluster it lives in the ffformer-tls ConfigMap (ffformer/deploy/k8s-https.yaml).
# 1) put the http-level blocks next to your `map $http_upgrade ...`
# 2) put the two location blocks inside the existing `server { listen 8443 ssl; ... }`
# 3) mount Secret comfyui-htpasswd at /etc/nginx/auth, then `kubectl rollout restart` the nginx deployment
#    (nginx does not reload ConfigMaps by itself).
# Why the map: ComfyUI's userdata API uses %2F-encoded paths; `proxy_pass http://svc/` would decode them (404).

# ---------- http level ----------
# Raw (still %-encoded) URI after the /test/comfyui prefix, query string included.
# Used as the proxy_pass target so ComfyUI's %2F-encoded userdata paths survive.
map $request_uri $comfyui_uri {
    ~^/test/comfyui(?<rest>/.*)$  $rest;
    default                       /;
}
# proxy_pass with a variable needs a runtime resolver unless the host is an upstream block.
upstream comfyui_backend {
    server comfyui-svc:8188;
}

# ---------- inside server { } ----------
# ---- ComfyUI (see /lustre1/work/c30636/test/comfyui-k8s) on a sub-path ----
# Same IP/port as ffformer; nginx strips /test/comfyui and proxies to the
# ComfyUI ClusterIP service. Basic Auth because ComfyUI has no login.
# Users: secret comfyui-htpasswd (htpasswd -B). ffformer itself is untouched.
location = /test/comfyui {
    absolute_redirect off;   # keep the internal :8443 out of the Location header
    return 301 /test/comfyui/;
}
location /test/comfyui/ {
    auth_basic           "ComfyUI";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Strip the prefix WITHOUT decoding the URI: ComfyUI's userdata API uses
    # %2F-encoded paths (workflows%2Fname.json) that a proxy_pass with a URI
    # part would decode into real slashes (-> 404). $request_uri is the raw URI.
    proxy_pass http://comfyui_backend$comfyui_uri;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /test/comfyui;
    # ComfyUI progress/preview WebSocket (/ws)
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
}
